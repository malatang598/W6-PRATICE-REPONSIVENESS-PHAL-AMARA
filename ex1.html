<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercise 1</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Georgia, serif; }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);   /* large screens */
    gap: 10px;
    padding: 20px;
  }
  .item { background: lightblue; padding: 16px; text-align: center; }

  @media (max-width: 1000px) {
    .grid { grid-template-columns: repeat(3, 1fr); gap: 14px; padding: 16px; }
  }
  @media (max-width: 768px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 12px; }
  }
  @media (max-width: 480px) {
    .grid { grid-template-columns: 1fr; gap: 8px; padding: 8px; }
  }
</style>
</head>
<body>
  <div class="grid">
    <div class="item">Item 1</div><div class="item">Item 2</div>
    <div class="item">Item 3</div><div class="item">Item 4</div>
    <div class="item">Item 5</div><div class="item">Item 6</div>
    <div class="item">Item 7</div><div class="item">Item 8</div>
  </div>
</body>
</html>
