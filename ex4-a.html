<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercise 4.a</title>
<style>
  body { margin: 0; }
  .wrapper { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .content { font-family: Georgia, serif; font-size: 1.5rem; padding: 6px 10px; }
  .small { display: none; }
  .big { display: inline; }
  .content { background: yellowgreen; color: #fff; }

  @media only screen and (max-width: 600px) {
    .content { background: tomato; font-size: 1rem; }
    .small { display: inline; }
    .big { display: none; }
  }
</style>
</head>
<body>
  <div class="wrapper">
    <div class="content">
      <span class="small">I'm SMALL 😢</span>
      <span class="big">I'm BIG 😱</span>
    </div>
  </div>
</body>
</html>
