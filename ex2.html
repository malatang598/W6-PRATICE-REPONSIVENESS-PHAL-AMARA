<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercise 2</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, sans-serif; }
  .navbar {
    background: #0c0c0c; color: #fff;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 24px; min-height: 64px; position: relative; flex-wrap: wrap;
  }
  .logo { font-size: 20px; font-weight: bold; }
  .menu { display: flex; gap: 24px; list-style: none; margin: 0; padding: 0; }
  .menu a { color: #fff; text-decoration: none; font-size: 14px; }
  .menu a:hover { text-decoration: underline; }
  .toggle { display: none; background: none; border: 0; color: #fff; font-size: 28px; cursor: pointer; }

  @media (max-width: 767px) {
    .toggle { display: block; }
    .menu {
      display: none; flex-direction: column; gap: 0; width: 100%;
    }
    .menu.open { display: flex; }
    .menu li a { display: block; padding: 14px 0; border-top: 1px solid #555; }
  }
</style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">Logo</div>
    <button class="toggle" aria-label="Toggle menu" aria-expanded="false">&#9776;</button>
    <ul class="menu">
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Services</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>
  <script>
    const btn = document.querySelector('.toggle');
    const menu = document.querySelector('.menu');
    btn.addEventListener('click', () => {
      const open = menu.classList.toggle('open');
      btn.setAttribute('aria-expanded', open);
    });
  </script>
</body>
</html>
