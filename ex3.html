<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercise 3 </title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, sans-serif; }
  header, footer { background:black; color: white; text-align: center; padding: 14px; }
  main { display: flex; flex-direction: column; gap: 12px; padding: 12px; }
  .content { background:rgb(205, 200, 200); padding: 14px; flex: 1; }
  .sidebar { background: rgb(182, 179, 179); padding: 14px; flex: 1; }

  @media (min-width: 600px) {
    header, footer { padding: 22px; font-size: 1.2rem; }
    main { flex-direction: row; }
  }
  @media (min-width: 900px) {
    header, footer { padding: 32px; font-size: 1.5rem; }
    .content { flex: 3; }
    .sidebar { flex: 1; }
  }
</style>
</head>
<body>
  <header>Responsive Header</header>
  <main>
    <section class="content">Main Content</section>
    <aside class="sidebar">Sidebar</aside>
  </main>
  <footer>Footer</footer>
</body>
</html>
